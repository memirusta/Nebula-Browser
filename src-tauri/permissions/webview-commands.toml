[[permission]]
identifier = "allow-nebula-webview-commands"
description = "Allow Nebula custom webview commands"
commands.allow = [
  "write_transition_log",
  "webview_navigate",
  "webview_close_tab",
  "webview_current_url",
  "webview_go_back",
  "webview_go_forward",
  "webview_reload",
  "webview_zoom",
  "webview_open_devtools",
  "webview_set_memory_usage",
  "webview_document_title",
  "webview_raise_ui",
  "webview_raise_overlay",
  "webview_raise_chrome",
  "webview_raise_tab_fullscreen",
  "window_enter_site_fullscreen",
  "window_exit_site_fullscreen",
  "webview_restore_browsing_layout",
  "webview_set_chrome_hit_region",
  "webview_set_shell_hit_region",
  "webview_setup_tab_error_pages",
  "webview_apply_privacy",
  "webview_clear_browsing_data",
  "ublock_extension_info",
  "ublock_extension_install",
  "ublock_extension_status",
  "webview_setup_branding",
  "webview_execute_script",
  "download_control",
  "get_system_stats",
  "detect_default_browser",
  "import_default_browser_bookmarks",
  "detect_browser_passwords",
  "list_chromium_password_sources",
  "inspect_browser_passwords",
  "import_default_browser_passwords",
  "exchange_google_oauth_token",
  "google_oauth_sign_in_loopback",
  "google_oauth_status"
]

[[permission]]
identifier = "allow-password-vault-commands"
description = "Allow the trusted main shell to access the encrypted password vault"
commands.allow = [
  "password_vault_load",
  "password_vault_save",
  "password_vault_clear"
]
