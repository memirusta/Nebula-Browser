<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Nebula UI palette prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Geist:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Design prototype for the app's own UI (home, pop-ups, settings, tour, shield). The colours are set from the toolbar by
     the script below; nothing here is final. */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --font: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif; --r: 14px; --r-sm: 10px; --r-lg: 22px; }
  body { font: 15px/1.5 var(--font); color: var(--text); background: var(--bg); min-height: 100vh; transition: background .25s; }
  button, input, select { font: inherit; color: inherit; }
  svg { display: block; flex: none; }

  /* toolbar (prototype only) */
  .toolbar { position: sticky; z-index: 50; top: 0; width: 100%; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; justify-content: center;
    padding: 9px 14px; background: rgba(16,16,24,.94); color: #e8eaf2; font: 12px/1 system-ui, sans-serif; backdrop-filter: blur(10px); box-shadow: 0 6px 24px rgba(0,0,0,.3); }
  .toolbar [hidden] { display: none; }
  .toolbar button { border: 0; background: transparent; color: #c9cedb; padding: 7px 11px; border-radius: 999px; cursor: pointer; }
  .toolbar button[aria-pressed="true"] { background: #fff; color: #111; font-weight: 600; }
  .toolbar .sep { width: 1px; height: 16px; background: rgba(255,255,255,.2); }
  .toolbar select { background: #2a2c38; color: #fff; border: 0; border-radius: 999px; padding: 6px 10px; font: 12px system-ui, sans-serif; }
  .toolbar label { display: flex; gap: 6px; align-items: center; }
  .toolbar input[type=range] { width: 110px; accent-color: #8b8dff; }
  .swatch { width: 11px; height: 11px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: -1px; }

  /* scenes */
  .scene { position: relative; min-height: calc(100vh - 56px); padding: 36px 32px 48px; overflow: hidden; isolation: isolate;
    background:
      radial-gradient(760px 440px at 50% -6%, color-mix(in srgb, var(--a) 40%, transparent), transparent 72%),
      radial-gradient(560px 380px at 88% 58%, color-mix(in srgb, var(--b) 20%, transparent), transparent 72%),
      radial-gradient(900px 620px at 18% 8%, var(--wall-a), transparent 62%),
      radial-gradient(800px 560px at 92% 92%, var(--wall-b), transparent 60%),
      var(--bg); }

  /* shared pieces */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow); backdrop-filter: blur(22px) saturate(1.25); }
  .glass { background: var(--glass); border: 1px solid var(--border); backdrop-filter: blur(26px) saturate(1.4); }
  .muted { color: var(--muted); } .faint { color: var(--faint); }
  .badge { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 13px; background: var(--soft); border: 1px solid var(--soft-border); color: var(--acc); }
  .badge.sm { width: 34px; height: 34px; border-radius: 11px; }
  .btn { height: 40px; padding: 0 18px; border-radius: var(--r-sm); border: 1px solid transparent; cursor: pointer; font-weight: 600; font-size: 14px; display: inline-flex; gap: 8px; align-items: center; justify-content: center; white-space: nowrap; }
  .btn.primary { background: linear-gradient(135deg, var(--a), var(--b)); color: #fff; box-shadow: 0 8px 22px -8px var(--glow); }
  .btn.primary:hover { filter: brightness(1.07); }
  .btn.ghost { background: transparent; color: var(--muted); }
  .btn.ghost:hover { background: var(--soft); color: var(--text); }
  .btn.line { background: var(--surface-2); border-color: var(--border); color: var(--text); }
  .btn.danger { background: transparent; color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); }
  .btn.sm { height: 34px; padding: 0 14px; font-size: 13px; }
  .kbd { font: 600 11px/1 var(--font); padding: 4px 7px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--border); color: var(--faint); }
  .toggle { width: 42px; height: 24px; border-radius: 99px; background: color-mix(in srgb, var(--text) 18%, transparent); position: relative; flex: none; transition: background .2s; }
  .toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s; }
  .toggle.on { background: linear-gradient(135deg, var(--a), var(--b)); } .toggle.on::after { transform: translateX(18px); }
  .seg { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); gap: 2px; }
  .seg span { padding: 7px 14px; border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .seg span.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.18), 0 0 0 1px var(--border); }
  .field { height: 40px; padding: 0 14px; border-radius: var(--r-sm); background: var(--surface-2); border: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 190px; font-size: 14px; }
  .range { width: 190px; height: 6px; border-radius: 6px; background: color-mix(in srgb, var(--text) 16%, transparent); position: relative; }
  .range i { position: absolute; inset: 0 auto 0 0; border-radius: 6px; background: linear-gradient(90deg, var(--a), var(--b)); }
  .range b { position: absolute; top: 50%; width: 18px; height: 18px; border-radius: 50%; background: #fff; transform: translate(-50%, -50%); box-shadow: 0 1px 5px rgba(0,0,0,.35), 0 0 0 3px var(--soft-border); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 20%, transparent); }

  /* ---------- home ---------- */
  .home .semi { position: absolute; z-index: 2; top: -2px; left: 50%; transform: translateX(-50%); width: min(60vw, 860px); height: 150px; border-radius: 0 0 50% 50% / 0 0 100% 100%;
    display: flex; justify-content: center; align-items: flex-start; gap: 16px; padding-top: 18px; box-shadow: 0 18px 50px -18px var(--glow); }
  .semi .win { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); }
  .semi .tabs { display: flex; gap: 8px; margin-top: 44px; position: absolute; }
  .semi .tab { display: flex; gap: 8px; align-items: center; padding: 8px 14px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); font-size: 13px; font-weight: 500; color: var(--muted); }
  .semi .tab.now { color: var(--text); border-color: var(--soft-border); background: var(--soft); }
  .home .rail { position: absolute; right: 22px; top: 34px; display: grid; gap: 14px; z-index: 2; }
  .home .rail .round { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; color: var(--text); }
  .home .widgets { position: absolute; left: 24px; top: 190px; display: grid; gap: 14px; width: 222px; }
  .widget { padding: 14px 16px; border-radius: 18px; }
  .widget .row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
  .widget svg.spark { width: 100%; height: 44px; margin-top: 8px; }
  .home .center { position: relative; z-index: 1; display: grid; justify-items: center; gap: 22px; padding-top: 200px; }
  .home .search { width: min(560px, 90%); height: 58px; border-radius: 999px; display: flex; align-items: center; gap: 12px; padding: 0 22px; color: var(--muted); font-size: 16px; box-shadow: 0 18px 50px -20px var(--glow); }
  .home .search .kbd { margin-left: auto; }
  .home .avatar { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, var(--a), var(--b)); display: grid; place-items: center; color: #fff; box-shadow: 0 12px 34px -10px var(--glow); }
  .home .greet { color: var(--muted); font-size: 15px; }
  .tiles { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 640px; }
  .tile { width: 92px; display: grid; justify-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
  .tile i { width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; font: 700 20px/1 var(--font); font-style: normal; color: #fff; box-shadow: 0 10px 26px -12px rgba(0,0,0,.6); }
  .home .clock { position: absolute; left: 30px; bottom: 28px; z-index: 1; font-size: 44px; font-weight: 300; letter-spacing: -.02em; line-height: 1; }
  .home .clock small { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin-top: 6px; letter-spacing: 0; }

  /* ---------- pop-ups ---------- */
  .popups .site { position: absolute; inset: 70px 0 0; z-index: -1; padding: 40px 12vw; display: grid; gap: 18px; align-content: start; opacity: .55; filter: blur(2px); }
  .site .ln { height: 14px; border-radius: 8px; background: color-mix(in srgb, var(--text) 14%, transparent); }
  .site .blk { height: 120px; border-radius: 18px; background: color-mix(in srgb, var(--text) 9%, transparent); }
  .popups .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 28px; max-width: 1180px; margin: 0 auto; align-items: start; }
  .pop { padding: 22px; width: 100%; max-width: 420px; justify-self: center; }
  .pop h3 { font-size: 17px; font-weight: 700; letter-spacing: -.01em; margin: 14px 0 4px; }
  .pop p { color: var(--muted); font-size: 14px; }
  .pop .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; flex-wrap: wrap; }
  .pop .origin { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--faint); margin-bottom: 2px; }
  .pop .opts { display: grid; gap: 8px; margin-top: 16px; }
  .pop .opt { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2); font-size: 14px; }
  .pop .opt.on { border-color: var(--soft-border); background: var(--soft); }
  .pop .pwd { display: grid; gap: 8px; margin-top: 14px; }
  .pop .pwd div { display: flex; justify-content: space-between; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); font-size: 14px; }
  .toast { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; max-width: 420px; justify-self: center; width: 100%; }
  .toast .bar { height: 4px; border-radius: 4px; background: color-mix(in srgb, var(--text) 14%, transparent); margin-top: 8px; overflow: hidden; }
  .toast .bar i { display: block; height: 100%; width: 70%; background: linear-gradient(90deg, var(--a), var(--b)); }

  /* ---------- settings (the app's real tabs, rows and defaults) ---------- */
  .settings .swin { max-width: 1240px; margin: 0 auto; height: calc(100vh - 56px - 72px); min-height: 620px; max-height: 860px; display: grid; grid-template-columns: 272px 1fr; overflow: hidden; padding: 0; position: relative; }
  .settings .snav { padding: 22px 14px 18px; border-right: 1px solid var(--border); background: color-mix(in srgb, var(--soft) 55%, transparent); display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
  .settings .snav h2 { font-size: 20px; font-weight: 800; letter-spacing: -.02em; padding: 2px 12px 12px; }
  .settings .ssearch { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 13px; margin: 0 0 10px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); color: var(--faint); font-size: 14px; }
  .settings .snav button.item { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border: 0; border-radius: 12px; background: transparent; color: var(--muted); font-weight: 500; font-size: 14.5px; text-align: left; cursor: pointer; }
  .settings .snav button.item:hover { background: var(--soft); color: var(--text); }
  .settings .snav button.item.on { background: var(--surface); color: var(--text); box-shadow: 0 0 0 1px var(--border); font-weight: 600; }
  .settings .snav button.item.on svg { color: var(--acc); }
  .settings .scontent { overflow-y: auto; padding: 0 36px 34px; }
  .settings .shead { position: sticky; top: 0; z-index: 3; padding: 26px 0 16px; background: linear-gradient(var(--surface) 75%, transparent); }
  .settings .shead h1 { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
  .settings .shead p { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .settings .sclose { position: absolute; top: 16px; right: 18px; z-index: 6; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); }
  .settings .sbody { display: grid; gap: 20px; }
  .settings .group { border: 1px solid var(--border); border-radius: 18px; background: var(--surface-2); overflow: hidden; }
  .settings .group > h4 { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); padding: 14px 18px 2px; font-weight: 700; }
  .srow { display: flex; justify-content: space-between; align-items: center; gap: 28px; padding: 14px 18px; }
  .srow + .srow { border-top: 1px solid var(--border); }
  .srow > div:first-child { min-width: 0; }
  .srow b { display: block; font-weight: 600; font-size: 14.5px; } .srow small { display: block; color: var(--muted); font-size: 13px; line-height: 1.4; margin-top: 1px; max-width: 560px; }
  .srow .field.wide { min-width: 260px; } .srow .field.empty { color: var(--faint); }
  .srow .sw { width: 18px; height: 18px; border-radius: 6px; box-shadow: 0 0 0 1px var(--border); }
  .srow .rng { display: flex; align-items: center; gap: 14px; flex: none; } .srow .rng em { font-style: normal; font-size: 13px; color: var(--muted); min-width: 56px; text-align: right; font-variant-numeric: tabular-nums; }
  .srow.indent { padding-left: 34px; background: color-mix(in srgb, var(--soft) 35%, transparent); }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .note { color: var(--muted); font-size: 13px; line-height: 1.5; padding: 4px 2px; }
  .group .note { padding: 6px 18px 14px; }
  .status { padding: 5px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 700; background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
  .status.off { background: var(--surface-2); color: var(--faint); border: 1px solid var(--border); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted); background: var(--surface-2); border: 1px solid var(--border); }
  .chip.on { background: var(--soft); color: var(--acc); border-color: var(--soft-border); }
  .kbd2 { display: inline-flex; gap: 4px; align-items: center; }
  .kbd2 kbd { font: 600 12px/1 var(--font); padding: 5px 8px; min-width: 26px; text-align: center; border-radius: 7px; background: var(--surface); border: 1px solid var(--border); box-shadow: 0 1px 0 var(--border); color: var(--text); }
  .kbd2 .plus { color: var(--faint); font-size: 11px; }
  .kbd2 .or { color: var(--faint); font-size: 12px; margin: 0 4px; }
  .sgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 14px 18px; }
  .preset { border-radius: 14px; padding: 8px; background: var(--surface); border: 1px solid var(--border); font-size: 12.5px; font-weight: 600; color: var(--muted); text-align: center; }
  .preset i { display: block; height: 62px; border-radius: 10px; margin-bottom: 7px; }
  .preset.on { border-color: var(--soft-border); box-shadow: 0 0 0 2px var(--soft); color: var(--text); }
  .wpos { display: flex; gap: 18px; align-items: center; padding: 14px 18px; border-top: 1px solid var(--border); }
  .wpos .prev { width: 210px; height: 124px; border-radius: 12px; position: relative; flex: none; background: radial-gradient(120px 90px at 40% 35%, color-mix(in srgb, var(--a) 55%, transparent), transparent 70%), radial-gradient(160px 100px at 85% 85%, color-mix(in srgb, var(--b) 35%, transparent), transparent 70%), var(--bg); box-shadow: inset 0 0 0 1px var(--border); }
  .wpos .prev::after { content: ""; position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.4); }
  .profile { display: flex; align-items: center; gap: 16px; padding: 18px; }
  .profile .av { width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, var(--a), var(--b)); display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 22px; flex: none; }
  .profile b { font-size: 17px; } .profile small { color: var(--muted); display: block; }
  .syncs { display: grid; gap: 10px; padding: 14px 18px; border-top: 1px solid var(--border); }
  .syncs label { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 13px; background: var(--surface); border: 1px solid var(--border); }
  .syncs label .cb { width: 20px; height: 20px; border-radius: 6px; background: linear-gradient(135deg, var(--a), var(--b)); color: #fff; display: grid; place-items: center; flex: none; margin-top: 1px; }
  .syncs label.off .cb { background: var(--surface-2); border: 1px solid var(--border); color: transparent; }
  .syncs strong { display: block; font-size: 14px; } .syncs small { color: var(--muted); font-size: 12.5px; }
  .pwrow { display: flex; align-items: center; gap: 14px; padding: 12px 18px; }
  .pwrow + .pwrow { border-top: 1px solid var(--border); }
  .pwrow .fav { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 14px; flex: none; }
  .pwrow div:nth-child(2) { flex: 1; min-width: 0; } .pwrow b { display: block; font-size: 14px; } .pwrow small { color: var(--muted); font-size: 12.5px; }
  .pwrow .dots { letter-spacing: 2px; color: var(--muted); font-size: 14px; }
  .ex { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .excard { padding: 18px; border-radius: 18px; background: var(--surface-2); border: 1px solid var(--border); display: grid; gap: 12px; }
  .excard .top { display: flex; gap: 14px; align-items: center; }
  .excard .mono { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 17px; flex: none; }
  .excard b { font-size: 16px; display: block; } .excard small { color: var(--muted); font-size: 12.5px; }
  .excard p { color: var(--muted); font-size: 13.5px; }
  .excard .foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .excard .ver { color: var(--ok); font-size: 12.5px; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
  .about { display: flex; gap: 18px; align-items: center; padding: 20px 18px; }
  .about img { width: 64px; height: 64px; border-radius: 18px; background: linear-gradient(135deg, var(--a), var(--b)); display: block; }
  .about b { font-size: 19px; display: block; }
  .swatches { display: flex; gap: 10px; align-items: center; }
  .swatches i { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; box-shadow: 0 0 0 1px var(--border); display: block; flex: none; }
  .swatches i.on { border-color: var(--surface); box-shadow: 0 0 0 2px var(--acc); }
  .advhead { all: unset; box-sizing: border-box; width: 100%; display: flex; align-items: center; gap: 14px; padding: 14px 18px; cursor: pointer; }
  .advhead:hover { background: var(--soft); }
  .advhead > div { flex: 1; } .advhead b { display: block; font-weight: 600; font-size: 14.5px; } .advhead small { color: var(--muted); font-size: 13px; }
  .advhead .count { color: var(--faint); font-size: 12.5px; }
  .advhead .chev { color: var(--muted); transition: transform .2s; } .advhead .chev.open { transform: rotate(180deg); }
  .advhead + .srow { border-top: 1px solid var(--border); }
  .shcard { padding: 18px; display: grid; gap: 14px; background: linear-gradient(135deg, var(--soft), transparent 70%), var(--surface-2); }
  .shcard .top { display: flex; gap: 14px; align-items: center; } .shcard .top b { font-size: 16px; display: block; } .shcard .top small { color: var(--muted); font-size: 13px; }
  .shcard .big { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .shcard .big div { padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); }
  .shcard .big strong { display: block; font-size: 26px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; color: var(--acc); } .shcard .big span { font-size: 12.5px; color: var(--muted); }
  .dangerzone { border-color: color-mix(in srgb, var(--danger) 35%, var(--border)); }

  /* ---------- settings, full screen (the onboarding's layout: steps at the left, content, art in the corner) ---------- */
  .scene.settings { padding: 0; min-height: calc(100vh - 56px); }
  .settings .under { position: absolute; inset: 0; z-index: 0; overflow: hidden; }
  .under-wall { position: absolute; inset: 0; z-index: -1; filter: saturate(var(--w-sat, 1.1)) contrast(var(--w-con, .82));
    background:
      radial-gradient(900px 620px at 18% 8%, var(--wall-a), transparent 62%),
      radial-gradient(800px 560px at 92% 92%, var(--wall-b), transparent 60%),
      radial-gradient(circle 9px at 32px 32px, color-mix(in srgb, var(--b) 30%, transparent) 88%, transparent 100%) 0 0 / 64px 64px,
      var(--bg); }
  .under .semi.glass { width: calc(min(60vw, 860px) * var(--lw-r, 1)); height: calc(150px * var(--lh-r, 1)); transform-origin: 50% 0;
    backdrop-filter: blur(var(--l-blur, 35px)) saturate(1.4); background: color-mix(in srgb, color-mix(in srgb, var(--a) 22%, var(--bg)) calc(var(--l-op, 38) * 1%), transparent); }

    'Background blur': 'blur', 'Glass tint': 'tint', 'Background saturation': 'sat', 'Background contrast': 'con',
    'Semi-lunar glass blur': 'lblur', 'Semi-lunar opacity': 'lop', 'Clock font size': 'clock',
    'Icon size': 'icon', 'Crescent width': 'lw', 'Crescent height': 'lh', 'Overlay blur': 'oblur', 'Overlay brightness': 'obright',
    'Open animation': 'dopen', 'Close animation': 'dclose', 'Open scale X': 'scx', 'Open scale Y': 'scy',
    'Browsing hover open delay': 'hdelay', 'Preview delay': 'pdelay', 'Close delay': 'cdelay', 'Close button delay': 'cbdelay', 'Folder merge': 'fmerge', 'Merge animation': 'manim',
  };
  const TKEYS = { 'Right toolbar': 'rail', 'System widgets': 'widgets', 'RAM widget': 'ram', 'CPU widget': 'cpu', 'Clock': 'clockon', 'Show date': 'date', 'Pinned sites': 'pins', 'Greeting message': 'greet', 'Profile avatar': 'avatar' };
  const LIVE = new Set(['blur', 'tint', 'sat', 'con', 'lblur', 'lop', 'clock', 'icon', 'lw', 'lh', 'oblur', 'obright']);
  const DEMO_SEMI = new Set(['dopen', 'dclose', 'scx', 'scy']);
  const DEMO_TIME = { hdelay: 'Menu opens after hovering for', pdelay: 'The preview starts after', cdelay: 'The menu closes after you leave, waiting', cbdelay: 'The ✕ shows on a shortcut after', fmerge: 'A folder forms after holding for', manim: 'The folder merge animation lasts' };
  const S = {}, T = {};
  let ENTER = true, lastSurface = null, FLASH = null, peekTimer = null, demoTimer = null;
  const $ = (id) => document.getElementById(id);
  const pct = (el, v) => Math.round(((v - +el.dataset.min) / (+el.dataset.max - +el.dataset.min)) * 100);

  function applyLive() {
    const u = $('under'); if (!u) return;
    const v = (k, d) => (k in S ? S[k] : d);
    const set = (k, val) => u.style.setProperty(k, val);
    set('--g-blur', v('blur', 40) * 0.6 + 'px'); set('--g-tint', 25 + v('tint', 14) * 1.5);
    set('--w-sat', v('sat', 110) / 100); set('--w-con', v('con', 82) / 100);
    set('--l-blur', v('lblur', 160) * 0.22 + 'px'); set('--l-op', v('lop', 38));
    set('--clock', v('clock', 36) * 1.22 + 'px'); set('--icon', v('icon', 44) + 'px');
    set('--lw-r', v('lw', 1100) / 1100); set('--lh-r', v('lh', 152) / 152);
    set('--o-blur', v('oblur', 24) * 0.45 + 'px'); set('--o-bright', v('obright', 45) / 100);
    for (const k of Object.keys(T)) u.classList.toggle('no-' + k, T[k] === false);
  }

  function renderPeek(el) {
    const bar = $('pmain'); if (!bar || !el) return;
    const k = el.dataset.key, p = pct(el, S[k]);
    const note = LIVE.has(k) ? 'Live preview behind. Release to go back.' : DEMO_SEMI.has(k) ? 'Replaying how the menu opens and closes.' : k in DEMO_TIME ? '' : 'Release to go back.';
    bar.innerHTML = `<div class="ptop"><b>${el.dataset.label}</b><em>${S[k]}${el.dataset.unit}</em></div><div class="range mirror"><i style="width:${p}%"></i><b style="left:${p}%"></b></div>${note ? `<div class="pnote">${note}</div>` : ''}`;
  }
  function startPeek(el) {
    clearTimeout(peekTimer);
    const u = $('under'); if (u) u.classList.toggle('ov', el.dataset.key === 'oblur' || el.dataset.key === 'obright');
    const demo = $('pdemo'); if (demo) demo.innerHTML = '';
    renderPeek(el); document.body.classList.add('peeking');
    if (DEMO_SEMI.has(el.dataset.key)) playSemi();
  }
  function endPeek() { clearTimeout(peekTimer); peekTimer = setTimeout(() => { document.body.classList.remove('peeking'); const u = $('under'); if (u) u.classList.remove('ov'); }, 320); }
  function flashPeek(label, text, ms) {
    const bar = $('pmain'); if (!bar) return; clearTimeout(peekTimer);
    bar.innerHTML = `<div class="ptop"><b>${label}</b><em>${text}</em></div><div class="pnote">Live preview behind.</div>`;
    const demo = $('pdemo'); if (demo) demo.innerHTML = '';
    document.body.classList.add('peeking'); peekTimer = setTimeout(() => document.body.classList.remove('peeking'), ms);
  }

  function playSemi() {
    const el = document.querySelector('#under .semi'); if (!el || !el.animate) return;
    const sx = (S.scx ?? 20) / 100, sy = (S.scy ?? 14) / 100, to = S.dopen ?? 260, tc = S.dclose ?? 140;
    el.getAnimations().forEach((a) => a.cancel());
    const small = 'translateX(-50%) scale(' + sx + ', ' + sy + ')', full = 'translateX(-50%) scale(1, 1)';
    const open = el.animate([{ transform: small, opacity: 0.25 }, { transform: full, opacity: 1 }], { duration: Math.max(to, 1), easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'both' });
    open.onfinish = () => setTimeout(() => {
      const close = el.animate([{ transform: full, opacity: 1 }, { transform: small, opacity: 0.25 }], { duration: Math.max(tc, 1), easing: 'ease-in', fill: 'both' });
      close.onfinish = () => setTimeout(() => el.getAnimations().forEach((a) => a.cancel()), 350);
    }, 650);
  }
  function runDemo(key, value) {
    clearTimeout(demoTimer);
    demoTimer = setTimeout(() => {
      if (DEMO_SEMI.has(key)) { playSemi(); return; }
      if (key in DEMO_TIME) { const box = $('pdemo'); if (box) box.innerHTML = `<div class="pnote">${DEMO_TIME[key]} <b>${value} ms</b></div><div class="pbar"><i style="animation-duration:${Math.max(value, 60)}ms"></i></div>`; }
    }, 150);
  }

  function setValue(key, value) {
    S[key] = value;
    document.querySelectorAll('.rng[data-key="' + key + '"]').forEach((el) => {
      const p = pct(el, value); el.querySelector('i').style.width = p + '%'; el.querySelector('b').style.left = p + '%'; el.querySelector('em').textContent = value + el.dataset.unit;
    });
    const el = document.querySelector('.rng[data-key="' + key + '"]'); renderPeek(el);
    applyLive(); runDemo(key, value);
  }

  document.addEventListener('pointerdown', (e) => {
    const track = e.target.closest('.rng[data-key] .range'); if (!track) return;
    const el = track.parentElement, key = el.dataset.key;
    e.preventDefault(); track.setPointerCapture(e.pointerId);
    const move = (ev) => {
      const r = track.getBoundingClientRect(), min = +el.dataset.min, max = +el.dataset.max;
      setValue(key, Math.round(Math.min(max, Math.max(min, min + ((ev.clientX - r.left) / r.width) * (max - min)))));
    };
    startPeek(el); move(e);
    const up = () => { track.removeEventListener('pointermove', move); track.removeEventListener('pointerup', up); track.removeEventListener('pointercancel', up); endPeek(); };
    track.addEventListener('pointermove', move); track.addEventListener('pointerup', up); track.addEventListener('pointercancel', up);
  });
  document.addEventListener('click', (e) => {
    const t = e.target.closest('.toggle[data-tkey]');
    if (t) { const k = t.dataset.tkey; T[k] = !(T[k] !== false); t.classList.toggle('on', T[k]); applyLive(); flashPeek(t.dataset.label, T[k] ? 'On' : 'Off', 1100); return; }
    const sw = e.target.closest('[data-look-pick]');
    if (sw) { state.look = sw.dataset.lookPick; FLASH = { label: 'Accent color', text: sw.dataset.lookPick, ms: 1400 }; apply(); }
  });

  function settingsScreen() {
    const tab = TABS.find((t) => t[0] === state.tab) || TABS[0];
    return `<section class="scene settings">
      <div class="under home" id="under"><div class="under-wall"></div>${homeBody()}</div>
      <div class="swin ${ENTER ? 'enter' : ''}">
        <div class="sart"><img src="/crab.jpg" alt=""></div>
        <nav class="snav"><div class="sbrand"><img src="/nebula-app-logo.png" alt=""><b>Settings</b></div><div class="ssearch">${I.search}Search settings…</div>
          ${TABS.map(([id, name, , icon], i) => `<button class="item ${id === tab[0] ? 'on' : ''}" data-tab="${id}" style="--i:${i}">${icon}${name}</button>`).join('')}
          <div class="shint"><span class="kbd">Esc</span> closes settings</div></nav>
        <div class="scontent"><header class="shead"><div><h1>${tab[1]}</h1><p>${tab[2]}</p></div><button class="btn primary">Done</button></header>
          <div class="sinner"><div class="sbody">${TAB_BODY[tab[0]]().join('')}</div></div></div></div>
      <div class="peekbar"><div id="pmain"></div><div id="pdemo"></div></div></section>`;
  }

  const SCREENS = {
    home: () => `<section class="scene home">${homeBody()}</section>`,

    popups: () => `<section class="scene popups"><div class="site"><div class="ln" style="width:38%"></div><div class="blk"></div><div class="ln" style="width:70%"></div><div class="ln" style="width:55%"></div><div class="blk"></div></div>
      <div class="grid">
        <div class="card pop"><div class="origin">${I.lock} github.com</div><div class="badge">${I.pin}</div><h3>Share your location?</h3><p>This site would like to know where you are to show nearby results.</p>
          <div class="opts"><div class="opt on"><span class="dot"></span>Allow while visiting the site</div><div class="opt">Allow this time only</div></div>
          <div class="actions"><button class="btn ghost">Block</button><button class="btn primary">Allow</button></div></div>

        <div class="card pop"><div class="origin">${I.lock} accounts.example.com</div><div class="badge">${I.key}</div><h3>Save this password?</h3><p>Nebula keeps it in its encrypted vault on this computer.</p>
          <div class="pwd"><div><span class="muted">Username</span><b>mehmet@example.com</b></div><div><span class="muted">Password</span><b>••••••••••</b></div></div>
          <div class="actions"><button class="btn ghost">Never</button><button class="btn primary">Save</button></div></div>

        <div class="card pop"><div class="badge">${I.up.replace('width="20" height="20"', 'width="20" height="20"')}</div><h3>Nebula 2.1 is ready</h3><p>The update is downloaded. Nebula restarts in a moment and your tabs come back.</p>
          <div class="actions"><button class="btn ghost">Later</button><button class="btn primary">Restart now</button></div></div>

        <div class="card pop"><div class="badge" style="color:var(--danger);background:color-mix(in srgb,var(--danger) 14%,transparent);border-color:color-mix(in srgb,var(--danger) 40%,transparent)">${I.x.replace('width="16" height="16"', 'width="20" height="20"')}</div><h3>Close 3 tabs?</h3><p>You have 3 open tabs in this window. They will be saved so you can reopen them.</p>
          <div class="actions"><button class="btn ghost">Cancel</button><button class="btn danger">Close tabs</button></div></div>

        <div class="card toast"><div class="badge sm">${I.dl}</div><div style="flex:1"><b style="font-size:14px">nebula-setup.exe</b><div class="muted" style="font-size:12.5px">12.4 MB of 17.8 MB · 3.1 MB/s</div><div class="bar"><i></i></div></div><button class="btn ghost sm">Pause</button></div>
      </div></section>`,

    settings: () => settingsScreen(),

    tour: () => `<section class="scene home tour"><div class="under">${homeBody()}</div><div class="hole"></div>
      <div class="card tcard"><div class="muted" style="font-size:12.5px;font-weight:600">Quick tour · Step 1 of 4</div>
        <div class="steps"><div class="on"><b>01</b>TOP EDGE</div><div><b>02</b>TABS</div><div><b>03</b>SEARCH</div><div><b>04</b>TOOLS</div></div>
        <h3>Open the menu from the top</h3><p class="muted" style="margin-top:6px">Hold the pointer at the top edge for a moment. Semi-Lunar opens, then closes when you move away.</p>
        <div class="hint">${I.up}Move your pointer up. No click needed.</div>
        <div class="foot"><button class="btn ghost sm">Skip tour</button><div style="display:flex;gap:8px"><button class="btn line sm" disabled style="opacity:.5">Back</button><button class="btn primary sm">Next</button></div></div></div></section>`,

    shield: () => `<section class="scene shield"><div class="browser">
      <div class="bar glass"><span class="muted">${I.globe}</span><div class="addr">${I.lock}<span>github.com/memirusta/Nebula-Browser</span></div><div class="shbtn">${I.shield}<em>23</em></div><span class="muted">${I.gear}</span></div>
      <div class="card panel"><div class="top"><div class="badge">${I.shield}</div><div style="flex:1"><b>Nebula Shield</b><small>github.com</small></div><span class="toggle on"></span></div>
        <div class="big"><div><strong>14</strong><span>Trackers blocked</span></div><div><strong>6</strong><span>Cookies blocked</span></div><div><strong>3</strong><span>Ads blocked</span></div><div><strong>1</strong><span>Upgraded to HTTPS</span></div></div>
        <div class="opt2"><span>Block trackers</span><span class="toggle on"></span></div><div class="opt2"><span>Block cross-site cookies</span><span class="toggle on"></span></div>
        <div class="opt2"><span>Upgrade to HTTPS</span><span class="toggle on"></span></div><div class="opt2"><span>Fingerprint protection</span><span class="toggle"></span></div>
        <div class="foot"><span>Shield is on for this site</span><span style="color:var(--acc);font-weight:600">All shield settings</span></div></div>
      <div class="card page"><div class="ln" style="height:18px;width:30%;background:color-mix(in srgb,var(--text) 18%,transparent);border-radius:8px"></div><div class="ln" style="height:12px;width:80%;background:color-mix(in srgb,var(--text) 12%,transparent);border-radius:8px"></div><div class="ln" style="height:12px;width:64%;background:color-mix(in srgb,var(--text) 12%,transparent);border-radius:8px"></div></div></div></section>`,
  };

  /* ----- toolbar wiring ----- */
  document.getElementById('looks').innerHTML = Object.entries(L).map(([k, v]) => `<button data-look="${k}"><span class="swatch" style="background:${v.sw}"></span>${v.name}</button>`).join('') +
    `<button data-look="custom"><span class="swatch" style="background:conic-gradient(#f43f5e,#f59e0b,#10b981,#3b82f6,#8b5cf6,#f43f5e)"></span>E · Custom</button>`;
  document.getElementById('surfaces').innerHTML = SURFACES.map(([k, n]) => `<button data-surface="${k}">${n}</button>`).join('');
  document.getElementById('font').innerHTML = FONTS.map(([n], i) => `<option value="${i}">${n}</option>`).join('');
  document.getElementById('font').value = state.font; document.getElementById('radius').value = state.radius; document.getElementById('hue').value = state.hue;
  document.addEventListener('click', (e) => {
    const b = e.target.closest('button, [data-wall], [data-acc]'); if (!b) return;
    if (b.dataset.look) state.look = b.dataset.look; else if (b.dataset.mode) state.mode = b.dataset.mode; else if (b.dataset.surface) state.surface = b.dataset.surface; else if (b.dataset.tab) state.tab = b.dataset.tab; else if (b.dataset.wall) state.wall = b.dataset.wall; else if (b.dataset.acc) state.acc = b.dataset.acc; else if (b.dataset.adv) state.adv = state.adv === '1' ? '0' : '1'; else return;
    apply();
  });
  document.getElementById('font').addEventListener('change', (e) => { state.font = Number(e.target.value); apply(); });
  document.getElementById('radius').addEventListener('change', (e) => { state.radius = Number(e.target.value); apply(); });
  document.getElementById('hue').addEventListener('input', (e) => { state.hue = Number(e.target.value); apply(); });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', apply);
  apply();
})();
</script>
</body>
</html>
